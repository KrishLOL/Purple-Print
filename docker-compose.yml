services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: weu
      POSTGRES_PASSWORD: weu
      POSTGRES_DB: western_eng_insider
    ports:
      - "5432:5432"
    volumes:
      - weu_pgdata:/var/lib/postgresql/data

volumes:
  weu_pgdata:
